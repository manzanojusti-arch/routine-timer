<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>Routine Timer</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b0f17;--card:#151b26;--card2:#1b2330;--text:#f8fafc;--muted:#94a3b8;--line:#2a3545;--accent:#5ee1a2;--accentText:#062d1d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:520px;margin:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}.tabs,.row,.grid2,.controls{display:flex;gap:10px}.tabs button{flex:1}.grid2>*{flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}button,input,select{font:inherit;font-size:16px}button{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--text);padding:10px 14px;font-weight:700}button.primary{background:var(--accent);color:var(--accentText);border-color:transparent}button:disabled{opacity:.45}input,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:13px;background:#0f1520;color:var(--text);padding:13px}label{display:block;font-size:13px;color:var(--muted)}h1,h2,p{margin-top:0}.muted{color:var(--muted)}.hidden{display:none!important}.exercise{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:8px}.exercise strong{display:block}.exercise small{color:var(--muted)}.timer{text-align:center;font-size:clamp(64px,21vw,100px);font-weight:900;letter-spacing:-5px;font-variant-numeric:tabular-nums;margin:34px 0 8px}.prep{text-align:center;padding:44px 8px}.prepNum{font-size:clamp(120px,42vw,190px);font-weight:950;line-height:1;margin:25px 0}.pulse{animation:pulse .7s ease-out}@keyframes pulse{0%{transform:scale(.7);opacity:.25}50%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:var(--accent);width:0}.controls>*{flex:1}.topline{display:flex;justify-content:space-between;gap:12px}.radio{display:flex;align-items:center;gap:10px;color:var(--text);padding:8px 0}.radio input{width:auto;margin:0}.next{text-align:center;margin:22px 0}.brand{font-size:24px;font-weight:900;margin-bottom:3px}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body><main>
<div class="brand">Routine Timer</div><p class="muted">Entrenamientos totalmente personalizados.</p>
<div class="tabs"><button id="tabBuild" class="primary">Rutina</button><button id="tabTrain">Entrenar</button></div>
<section id="build">
<div class="card"><h2>Preparación inicial</h2><label class="radio"><input type="radio" name="prep" value="3" checked>3 segundos</label><label class="radio"><input type="radio" name="prep" value="5">5 segundos</label></div>
<div class="card"><h2>Orden</h2><label class="radio"><input type="radio" name="order" value="circuit" checked><span><b>Circuito</b><br><small class="muted">Una serie de cada ejercicio por vuelta</small></span></label><label class="radio"><input type="radio" name="order" value="straight"><span><b>Series seguidas</b><br><small class="muted">Todas las series antes de avanzar</small></span></label></div>
<form id="form" class="card"><h2>Agregar ejercicio</h2><label>Nombre<input id="name" required maxlength="40" placeholder="Ej: Sentadillas"></label><div class="grid2"><label>Tipo<select id="mode"><option value="time">Tiempo</option><option value="reps">Repeticiones</option></select></label><label id="amountLabel">Segundos<input id="amount" type="number" min="1" max="3600" value="30"></label></div><div class="grid2"><label>Series<input id="sets" type="number" min="1" max="30" value="3"></label><label>Descanso (s)<input id="rest" type="number" min="0" max="1800" value="20"></label></div><button class="primary" style="width:100%;margin-top:14px">+ Agregar ejercicio</button><p id="err" class="muted" style="margin:10px 0 0"></p></form>
<div id="list"></div><button id="go" class="primary" style="width:100%;margin-top:14px">Empezar entrenamiento →</button>
</section>
<section id="train" class="hidden"><div id="normal"><div class="topline"><div><small id="phase" class="muted">PREPARADO</small><h2 id="exercise">Tu rutina</h2></div><div style="text-align:right"><b id="round">—</b><br><small id="step" class="muted">—</small></div></div><div id="timer" class="timer">00:00</div><p id="sub" class="muted" style="text-align:center">Listo para comenzar</p><div class="progress"><div id="bar"></div></div><div class="next"><small class="muted">SIGUIENTE</small><div id="next">—</div></div><div class="controls"><button id="prev">←</button><button id="play" class="primary">Iniciar</button><button id="skip">→</button></div><button id="complete" class="primary hidden" style="width:100%;margin-top:10px">✓ Serie completada</button><button id="restart" style="width:100%;margin-top:10px">Reiniciar entrenamiento</button></div><div id="prepScreen" class="card prep hidden"><b style="letter-spacing:4px">PREPARATE</b><h2 id="prepExercise" style="margin-top:14px">Primer ejercicio</h2><div id="prepNumber" class="prepNum">3</div><p class="muted">Posicionate para comenzar</p></div></section>
<script>
const $=s=>document.querySelector(s);let exercises=JSON.parse(localStorage.getItem('routineExercises')||'[]'),plan=[],idx=-1,remaining=0,total=0,timer=null,running=false,preparing=false;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Math.round(Number(v)||a))),fmt=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');
function save(){localStorage.setItem('routineExercises',JSON.stringify(exercises));localStorage.setItem('routineOrder',document.querySelector('input[name=order]:checked').value);localStorage.setItem('routinePrep',document.querySelector('input[name=prep]:checked').value)}
function restore(){const o=localStorage.getItem('routineOrder'),p=localStorage.getItem('routinePrep');if(o&&document.querySelector(`input[name=order][value=${o}]`))document.querySelector(`input[name=order][value=${o}]`).checked=true;if(p&&document.querySelector(`input[name=prep][value=${p}]`))document.querySelector(`input[name=prep][value=${p}]`).checked=true}
function stop(){clearInterval(timer);timer=null;running=false}function tab(t){$('#build').classList.toggle('hidden',t!=='build');$('#train').classList.toggle('hidden',t!=='train');$('#tabBuild').classList.toggle('primary',t==='build');$('#tabTrain').classList.toggle('primary',t==='train')}
$('#tabBuild').onclick=()=>{stop();preparing=false;tab('build')};$('#tabTrain').onclick=()=>tab('train');$('#mode').onchange=()=>{$('#amountLabel').childNodes[0].nodeValue=$('#mode').value==='time'?'Segundos':'Repeticiones';$('#amount').value=$('#mode').value==='time'?30:12};
$('#form').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim();if(!name)return $('#err').textContent='Escribí un ejercicio.';exercises.push({name,mode:$('#mode').value,amount:clamp($('#amount').value,1,3600),sets:clamp($('#sets').value,1,30),rest:clamp($('#rest').value,0,1800)});$('#name').value='';$('#err').textContent='';save();render();buildPlan()};
document.querySelectorAll('input[name=order],input[name=prep]').forEach(x=>x.onchange=()=>{save();buildPlan()});
function render(){$('#list').innerHTML='';exercises.forEach((x,i)=>{const row=document.createElement('div');row.className='exercise';const info=document.createElement('div');info.innerHTML='<strong></strong><small></small>';info.children[0].textContent=x.name;info.children[1].textContent=(x.mode==='time'?x.amount+' s':x.amount+' reps')+' · '+x.sets+' series · '+x.rest+' s descanso';const del=document.createElement('button');del.textContent='Eliminar';del.onclick=()=>{exercises.splice(i,1);save();render();buildPlan()};row.append(info,del);$('#list').append(row)})}
function push(x,s,r){plan.push({type:'work',...x,set:s,round:r});if(x.rest>0)plan.push({type:'rest',name:'Descanso',amount:x.rest,round:r})}
function buildPlan(){stop();plan=[];const circuit=document.querySelector('input[name=order]:checked').value==='circuit';if(circuit){const max=Math.max(0,...exercises.map(x=>x.sets));for(let s=1;s<=max;s++)exercises.forEach(x=>{if(s<=x.sets)push(x,s,s)})}else exercises.forEach(x=>{for(let s=1;s<=x.sets;s++)push(x,s,s)});if(plan.at(-1)?.type==='rest')plan.pop();idx=-1;idle()}
function idle(){$('#normal').classList.remove('hidden');$('#prepScreen').classList.add('hidden');$('#phase').textContent='PREPARADO';$('#exercise').textContent=exercises.length?'Rutina preparada':'Tu rutina';$('#timer').textContent='00:00';$('#sub').textContent='Listo para comenzar';$('#round').textContent='—';$('#step').textContent='—';$('#next').textContent=plan[0]?.name||'—';$('#bar').style.width='0%';$('#play').textContent='Iniciar';$('#complete').classList.add('hidden')}
function prep(){if(preparing)return;preparing=true;stop();let n=Number(document.querySelector('input[name=prep]:checked').value)||3;$('#normal').classList.add('hidden');$('#prepScreen').classList.remove('hidden');$('#prepExercise').textContent=plan[0]?.name||'Primer ejercicio';const show=()=>{const el=$('#prepNumber');el.textContent=n;el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')};show();timer=setInterval(()=>{n--;if(n>0)show();else{clearInterval(timer);timer=null;const el=$('#prepNumber');el.textContent='¡YA!';el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');setTimeout(()=>{preparing=false;$('#prepScreen').classList.add('hidden');$('#normal').classList.remove('hidden');load(0)},650)}},1000)}
function load(i){stop();idx=Math.max(0,i);if(idx>=plan.length){$('#phase').textContent='COMPLETADO';$('#exercise').textContent='Entrenamiento terminado';$('#timer').textContent='✓';$('#sub').textContent='Rutina finalizada';$('#round').textContent='FIN';$('#step').textContent='100%';$('#next').textContent='—';$('#bar').style.width='100%';$('#complete').classList.add('hidden');return}const p=plan[idx];total=p.amount;remaining=p.amount;$('#phase').textContent=p.type==='rest'?'DESCANSO':'EJERCICIO';$('#exercise').textContent=p.name;$('#round').textContent=(document.querySelector('input[name=order]:checked').value==='circuit'?'Vuelta ':'Serie ')+p.round;$('#step').textContent=(idx+1)+' / '+plan.length;$('#next').textContent=plan[idx+1]?.name||'Fin';$('#complete').classList.toggle('hidden',!(p.type==='work'&&p.mode==='reps'));$('#sub').textContent=p.type==='rest'?'Recuperación':'Serie '+(p.set||'')+(p.set?' de '+p.sets:'');update();if(p.type==='work'&&p.mode==='reps'){$('#timer').textContent=p.amount;$('#sub').textContent='REPETICIONES';$('#play').textContent='—'}else countdown()}
function update(){const p=plan[idx];if(!p)return;if(!(p.type==='work'&&p.mode==='reps'))$('#timer').textContent=fmt(remaining);$('#bar').style.width=(total?((total-remaining)/total*100):0)+'%'}function countdown(){running=true;$('#play').textContent='Pausar';timer=setInterval(()=>{remaining--;update();if(remaining<=0){stop();load(idx+1)}},1000)}
$('#go').onclick=()=>{if(!exercises.length)return $('#err').textContent='Agregá al menos un ejercicio.';buildPlan();tab('train')};$('#play').onclick=()=>{if(!plan.length){tab('build');return $('#err').textContent='Agregá al menos un ejercicio.'}if(idx<0)return prep();const p=plan[idx];if(p?.type==='work'&&p.mode==='reps')return;if(running){stop();$('#play').textContent='Continuar'}else countdown()};$('#skip').onclick=()=>plan.length&&load(idx<0?0:idx+1);$('#prev').onclick=()=>plan.length&&load(Math.max(0,idx-1));$('#complete').onclick=()=>load(idx+1);$('#restart').onclick=()=>{stop();preparing=false;idx=-1;idle()};
restore();render();buildPlan();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></main></body></html>
